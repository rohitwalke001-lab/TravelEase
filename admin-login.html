<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login - TravelEase
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="auth-page">


<nav>

    <a
        href="index.html"
        class="logo">

        🚌 Travel<span>Ease</span>

    </a>


    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="buses.html">
                Bus Tickets
            </a>
        </li>

        <li>
            <a href="hotels.html">
                Hotels
            </a>
        </li>

        <li>
            <a href="destinations.html">
                Destinations
            </a>
        </li>

        <li>
            <a href="packages.html">
                Packages
            </a>
        </li>

    </ul>


</nav>



<section class="admin-auth-container">


    <div class="admin-login-box">


        <div class="admin-icon">

            👨‍💼

        </div>


        <p class="auth-small-title">

            TRAVELEASE ADMIN

        </p>


        <h1>

            Admin Portal

        </h1>


        <p class="admin-description">

            Login to manage buses, hotels,
            packages, destinations and bookings.

        </p>



        <div class="auth-form">


            <label>

                Username

            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter admin username">



            <label>

                Password

            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password">



            <button
                class="auth-btn"
                onclick="adminLogin()">

                Access Dashboard

                <span>

                    →

                </span>

            </button>


            <a
                href="login.html"
                class="admin-back-link">

                ← Back to Customer Login

            </a>


        </div>


        <div class="admin-security">

            🔒 Secure Admin Access

        </div>


    </div>


</section>


<script src="script.js"></script>


</body>

</html>
