
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TravelEase booking bill and payment status">
    <title>TravelEase - Booking Bill</title>
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
    <nav>
        <h2>🚌 TravelEase</h2>
    </nav>
 
    <main class="bill-page">
        <section class="bill-header" aria-labelledby="billTitle">
            <h1 id="billTitle">Booking Receipt</h1>
            <p id="billStatusMessage" role="status" aria-live="polite">
                Your booking details are shown below. Please check the payment status.
            </p>
        </section>
 
        <section
            id="billContent"
            class="bill-container"
            aria-label="Booking and payment details"
            aria-live="polite"
        >
            <p>Loading your booking details...</p>
        </section>
 
        <div class="bill-buttons">
            <button
                type="button"
                class="primary-btn"
                onclick="printBill()"
            >
                🖨️ Print Bill
            </button>
 
            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='bookings.html'"
            >
                📋 My Bookings
            </button>
 
            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='index.html'"
            >
                🏠 Back To Home
            </button>
        </div>
    </main>
 
    <script src="script.js"></script>
</body>
</html>
