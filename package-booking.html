    rel="stylesheet"
    href="style.css"
>

</head>

<body>


<nav>

<a
    href="index.html"
    class="logo"
>

    🚌 Travel<span>Ease</span>

</a>


<ul class="nav-links">

    <li>
        <a href="index.html">
            Home
        </a>
    </li>

    <li>
        <a href="buses.html">

    </li>

    <li>
        <a href="hotels.html">

    </li>

    <li>
        <a href="destinations.html">

        </a>

    <li>

        <a href="bookings.html">

        </a>
    </li>

</ul>


<div
    class="nav-buttons"
    id="navButtons"
></div>

</nav>



<section class="booking-page">


<div class="booking-title">

    <h1>
        🎁 Complete Your Package Booking
    </h1>

    <p>
        Select your travel date and number of guests.
    </p>

</div>



<div class="booking-layout">


    <!-- PACKAGE DETAILS -->

    <div
        id="selectedPackageDetails"
        class="booking-details-box"
    >

    </div>



    <!-- BOOKING FORM -->

    <div class="booking-form-box">


        <h2>
            Package Booking Details
        </h2>


        <label>
            Travel Date
        </label>


        <input
            type="date"
            id="packageDate"
            required
        >


        <label>
            Number of Guests
        </label>


        <input
            type="number"
            id="packageGuests"
            min="1"
            placeholder="Enter number of guests"
            required
        >


        <button
            class="primary-btn booking-confirm-btn"
            onclick="confirmPackageBooking()"
        >

            ✅ Continue to Payment

        </button>


    </div>


</div>


</section>


<script src="script.js"></script>


</body>
